
<html>
  <head>
	<style>
		* {
			box-sizing: border-box;
		}
		
		body{
			--space: 1rem;
			min-height: 90vh;
			display: grid;
			align-content: center;
			overflow: hidden;
			gap: var(--space);
			width:100%;
			font-size: 1.5rem;
			line-height: 1;
		}
		
		.table-cell-font {
		  font-family: Arial, sans-serif;
		  font-size: 18px;
		  color: #333;
		  font-weight: normal;
		}
		.marquee{
			--duration: 10s;
			--gap: var(--space);
			display: flex;
			overflow: hidden;
			user-select: none;
			gap: var(--gap);
			direction:up;
		}
		
		.marquee__group{
			flex-shrink: 0;
			display: flex;
			align-items: center;
			justify-content: space-around;
			gap: var(--gap);
			min-width:100%;
			direction:up;
			animation: scroll var(--duration) linear infinite;			
		}
		
		@media (prefers-reduced-motion:reduce){
			.marquee__group{
				animation-play-state:paused;
			}
		}
		
		.marquee__group img{
			aspect-ratio:1;
			object-fit:cover;
			border-radius: 1rem;
			border: 1px solid #ccc
			padding: 3rem;
			direction:up;
		}
		
		@keyframes scroll{
			0% { transform: translateX(0); } 
			100% { transform: translateX(calc(
				-100% - var(--gap))
			); } 
		}
	</style>
