
<html lang="hi">
  <head>
	<style>
		* {
			box-sizing: border-box;
		}
		
		body{
			--space: 1rem;
			min-height: 90vh;
			display: grid;
			align-content: center;
			overflow: hidden;
			gap: var(--space);
			width:100%;
			font-size: 1.5rem;
			line-height: 1;
		}
		
		.marquee{
			--duration: 10s;
			--gap: var(--space);
			display: flex;
			overflow: hidden;
			user-select: none;
			gap: var(--gap);
		}
		
		.marquee__group{
			flex-shrink: 0;
			display: flex;
			align-items: center;
			justify-content: space-around;
			gap: var(--gap);
			min-width:100%;
			animation: scroll var(--duration) linear infinite;			
		}
		
		@media (prefers-reduced-motion:reduce){
			.marquee__group{
				animation-play-state:paused;
			}
		}
		
		.marquee__group img{
			aspect-ratio:1;
			object-fit:cover;
			border-radius: 1rem;
			border: 1px solid #ccc
			padding: 3rem;
		}
		
		@keyframes scroll{
			0%{
				transform: transLatex(0)
			}
			100%{
				transform: transLatex(calc(-100% - var(--gap)));
			}
		}
	</style>
    <title>
      Om Honda
    </title>    
  </head>
  <body>

			<img src="./Image 3.jpeg" alt="Word to html"  width ="100%" height = "500" />
		</div>

			<img src="./Image1.jpeg" alt="Word to html"  width ="100%" height = "500" />
			<img src="./Image2.jpeg" alt="Word to html"  width ="100%" height = "500" />

</html>
